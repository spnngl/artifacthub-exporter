# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json

# A `v<major>.<minor>.<patch>` tag builds the deb and rpm of amd64 and arm64 (.goreleaser.yaml),
# checks and installs each on its distribution, then publishes one GitHub release with checksums,
# an SBOM, a Sigstore signature and attestations. Nothing is published unless every check passed.
name: release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      version: ${{ fromJSON(steps.goreleaser.outputs.metadata).version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser reads the tags; the check below reads origin/main
          persist-credentials: false
      - name: Tag is a release on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # nfpm writes a pre-release `-rc.1` as `~rc.1`, which the package checks below don't expect.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $TAG is not v<major>.<minor>.<patch>"
            exit 1
          fi
          # A rebase merge rewrites the commit, so a tag made before the merge is on no branch.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::the tagged commit $GITHUB_SHA is not on main: tag the commit the pull request merged"
            exit 1
          fi
      # No cache on purpose: a release must not build from state a pull request could write.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        id: goreleaser
        with:
          version: v2.18.3
          args: release --clean
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  deb:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-26.04, arch: amd64 }
          - { runner: ubuntu-26.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      - name: Check and install the deb
        env:
          VERSION: ${{ needs.build.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          deb="./dist/artifacthub-exporter_${VERSION}_${ARCH}.deb"
          [ "$(dpkg-deb -f "$deb" Package)" = artifacthub-exporter ]
          [ "$(dpkg-deb -f "$deb" Version)" = "$VERSION" ]
          [ "$(dpkg-deb -f "$deb" Architecture)" = "$ARCH" ]
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends lintian
          lintian --fail-on error --suppress-tags-from-file packaging/lintian-suppress "$deb"
          sudo apt-get install --yes "$deb"
          artifacthub-exporter --version | grep -Fx "artifacthub-exporter $VERSION"

  rpm:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-26.04, arch: x86_64 }
          - { runner: ubuntu-26.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    # Fedora's rpmlint: Ubuntu's extracts the rpm wrong and reports a false no-binary. In a
    # container runner.temp is the host's path, so the steps use relative ones.
    container: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      - name: Check and install the rpm
        env:
          VERSION: ${{ needs.build.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          rpm="./dist/artifacthub-exporter-${VERSION}-1.${ARCH}.rpm"
          [ "$(rpm -qp --queryformat '%{NAME} %{VERSION} %{ARCH}' "$rpm")" = "artifacthub-exporter $VERSION $ARCH" ]
          # rpmlint extracts the rpm with tar.
          dnf install --assumeyes rpmlint tar gzip
          rpmlint -c packaging/rpmlint.toml "$rpm"
          dnf install --assumeyes "$rpm"
          artifacthub-exporter --version | grep -Fx "artifacthub-exporter $VERSION"

  # The only job that can write the release or request an OIDC token, so one identity (this
  # workflow at the tag) signs and attests every asset.
  publish:
    needs: [build, deb, rpm]
    runs-on: ubuntu-26.04
    permissions:
      contents: write # create the release
      id-token: write # keyless Sigstore signing
      attestations: write # provenance and SBOM attestations
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the shortlog needs the previous tag
          persist-credentials: false
      # Outside the checkout, which the SBOM step scans.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/assets

      # One SBOM for every package: they all build from the same go.sum.
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: ${{ runner.temp }}/assets/artifacthub-exporter_${{ env.VERSION }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Write SHA256SUMS
        working-directory: ${{ runner.temp }}/assets
        run: |
          sha256sum -- *.deb *.rpm *.spdx.json > SHA256SUMS
          cat SHA256SUMS
          [ "$(wc -l < SHA256SUMS)" = 5 ]

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      # SHA256SUMS lists every other asset, so one signature covers them all.
      - name: Sign SHA256SUMS
        working-directory: ${{ runner.temp }}/assets
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - name: Attest the build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/assets/*.deb
            ${{ runner.temp }}/assets/*.rpm
      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/assets/*.deb
            ${{ runner.temp }}/assets/*.rpm
          sbom-path: ${{ runner.temp }}/assets/artifacthub-exporter_${{ env.VERSION }}.spdx.json

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          identity="https://github.com/$REPOSITORY/.github/workflows/release.yml@refs/tags/$TAG"
          previous=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          {
            echo "## Verify a download"
            echo
            echo '```sh'
            echo "gh attestation verify <file> --repo $REPOSITORY"
            echo "cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \\"
            echo "  --certificate-identity $identity \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "sha256sum -c --ignore-missing SHA256SUMS"
            echo '```'
            echo
            echo "## Commits"
            echo
            echo '```'
            git shortlog --no-merges "${previous:+$previous..}$TAG"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          # GitHub appends its generated notes to these.
          gh release create "$TAG" --verify-tag --title "artifacthub-exporter $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes "$RUNNER_TEMP"/assets/*
